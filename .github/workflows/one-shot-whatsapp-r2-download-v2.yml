name: One-shot WhatsApp R2 download v2
on:
  push:
    paths:
      - '.github/workflows/one-shot-whatsapp-r2-download-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/sneakermania-final-20260907
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix_whatsapp_r2.py
      - name: Validate JavaScript
        run: |
          node --check js/modules/ordenes.js
          node --check www/js/modules/ordenes.js
          git diff --check
      - name: Commit
        run: |
          rm -f .github/workflows/one-shot-whatsapp-r2-download-v2.yml
          rm -f .github/scripts/fix_whatsapp_r2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: descargar fotos R2 via Edge Function para WhatsApp"
          git push origin HEAD:release/sneakermania-final-20260907
