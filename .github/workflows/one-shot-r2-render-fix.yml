name: One-shot R2 render fix

on:
  push:
    branches:
      - release/sneakermania-final-20260907
    paths:
      - .github/workflows/one-shot-r2-render-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/sneakermania-final-20260907
          fetch-depth: 0

      - name: Apply safe R2 rendering patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: esperado 1 match, encontrados {count}')
              return text.replace(old, new, 1)

          def regex_once(text, pattern, repl, label):
              out, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: esperado 1 match regex, encontrados {count}')
              return out

          # ------------------------------------------------------------
          # storage-manager.js — r2:// nunca sale sin resolver.
          # ------------------------------------------------------------
          for rel in ['js/storage-manager.js', 'www/js/storage-manager.js']:
              p = Path(rel)
              s = p.read_text(encoding='utf-8')

              old = '''export async function resolveImageUrl(url, path = null) {
            if (!url || typeof url !== 'string') return url;
            const objectPath = path || extraerPathR2(url);
            if (!objectPath) return url;
            const cached = SIGNED_URL_CACHE.get(objectPath);
            if (cached && cached.expiresAt > Date.now()) return cached.url;
            try {
              const tid1 = tenantId();
              const { data, error } = await supabase.functions.invoke('r2-storage', {
                body: { action: 'signed-url', path: objectPath, expires: 3000 },
                headers: tid1 ? { 'x-tenant-id': tid1 } : {}
              });
              if (!error && data?.url) {
                SIGNED_URL_CACHE.set(objectPath, { url: data.url, expiresAt: Date.now() + SIGNED_URL_TTL_MS });
                return data.url;
              }
            } catch (e) {
              console.warn('No se pudo obtener URL firmada; se mantiene URL existente:', e);
            }
            return url;
          }

          export async function resolveImageUrls(fotos) {
            if (!Array.isArray(fotos)) return [];
            // Todas las firmas se piden EN PARALELO (Promise.all), no una tras otra, para
            // que la galería de una orden cargue de golpe y no foto por foto.
            return Promise.all(fotos.map(async f => ({ ...f, resolvedUrl: await resolveImageUrl(f.url, f.path) })));
          }'''
              new = '''export async function resolveImageUrl(url, path = null) {
            if (!url || typeof url !== 'string') return url;
            const esReferenciaR2 = url.startsWith('r2://');
            const objectPath = path || extraerPathR2(url);
            if (!objectPath) return esReferenciaR2 ? null : url;
            const cached = SIGNED_URL_CACHE.get(objectPath);
            if (cached && cached.expiresAt > Date.now()) return cached.url;
            try {
              const tid1 = tenantId();
              const { data, error } = await supabase.functions.invoke('r2-storage', {
                body: { action: 'signed-url', path: objectPath, expires: 3000 },
                headers: tid1 ? { 'x-tenant-id': tid1 } : {}
              });
              if (!error && data?.url) {
                SIGNED_URL_CACHE.set(objectPath, { url: data.url, expiresAt: Date.now() + SIGNED_URL_TTL_MS });
                return data.url;
              }
              if (esReferenciaR2) {
                console.warn('No se pudo resolver referencia R2:', objectPath, error || 'respuesta sin URL firmada');
                return null;
              }
            } catch (e) {
              if (esReferenciaR2) {
                console.warn('No se pudo resolver referencia R2:', objectPath, e);
                return null;
              }
              console.warn('No se pudo obtener URL firmada; se mantiene URL existente:', e);
            }
            return esReferenciaR2 ? null : url;
          }

          export async function resolveImageUrls(fotos) {
            if (!Array.isArray(fotos)) return [];
            // Todas las firmas se piden EN PARALELO (Promise.all), no una tras otra, para
            // que la galería de una orden cargue de golpe y no foto por foto.
            // resolvedUrl es null cuando una referencia r2:// no pudo resolverse.
            return Promise.all(fotos.map(async f => ({ ...f, resolvedUrl: await resolveImageUrl(f.url, f.path) })));
          }'''
              s = replace_once(s, old, new, f'{rel}: resolveImageUrl(s)')

              old = '''    const src = img.getAttribute('src');
            const signed = await resolveImageUrl(src);
            if (signed && signed !== src) img.setAttribute('src', signed);'''
              new = '''    const src = img.getAttribute('src');
            const signed = await resolveImageUrl(src);
            if (signed && signed !== src) {
              img.setAttribute('src', signed);
              img.removeAttribute('data-r2-unavailable');
            } else if (!signed && src && src.startsWith('r2://')) {
              img.removeAttribute('src');
              img.dataset.r2Unavailable = 'true';
            }'''
              s = replace_once(s, old, new, f'{rel}: secureImageUrlsInDom')
              p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------
          # ordenes.js — blob: para nuevas; HTTPS firmada para existentes.
          # ------------------------------------------------------------
          for rel in ['js/modules/ordenes.js', 'www/js/modules/ordenes.js']:
              p = Path(rel)
              s = p.read_text(encoding='utf-8')

              s = replace_once(
                  s,
                  "  fotosGeneralesPendientes = [];\n  fotosGeneralesExistentes = id && o.extra && Array.isArray(o.extra.fotos)",
                  "  limpiarFotosGeneralesPendientes();\n  fotosGeneralesExistentes = id && o.extra && Array.isArray(o.extra.fotos)",
                  f'{rel}: limpiar pendientes al abrir'
              )
              s = replace_once(
                  s,
                  "  renderFotosGeneralesPreview();\n\n  // Resetear el label de estado de pago",
                  "  await renderFotosGeneralesPreview();\n\n  // Resetear el label de estado de pago",
                  f'{rel}: await preview openOrdenModal'
              )

              pattern = r"let fotosGeneralesPendientes = \[\];\nlet fotosGeneralesExistentes = \[\];\n\nfunction renderFotosGeneralesPreview\(\) \{.*?\n\}\n\n/\*\* Agrega fotos a la cola pendiente \(se suben al guardar la orden\)\. \*/\nexport function agregarFotosGeneralesOrden\(fileList\) \{.*?\n\}\n\nexport function quitarFotoGeneralPendiente\(i\) \{.*?\n\}"
              repl = '''let fotosGeneralesPendientes = [];
          let fotosGeneralesExistentes = [];
          let _fotosGeneralesRenderGen = 0;

          function limpiarFotosGeneralesPendientes() {
            for (const f of fotosGeneralesPendientes) {
              if (f && typeof f.previewUrl === 'string' && f.previewUrl.startsWith('blob:')) {
                URL.revokeObjectURL(f.previewUrl);
              }
            }
            fotosGeneralesPendientes = [];
          }

          async function renderFotosGeneralesPreview() {
            const cont = document.getElementById('orden-fotos-generales-preview');
            if (!cont) return;
            const miGen = ++_fotosGeneralesRenderGen;
            const existentesResueltas = await storageManager.resolveImageUrls(fotosGeneralesExistentes);
            if (miGen !== _fotosGeneralesRenderGen) return;

            const navegables = existentesResueltas.filter(f =>
              typeof f.resolvedUrl === 'string' && !f.resolvedUrl.startsWith('r2://'));
            const allUrls = JSON.stringify(navegables.map(f => f.resolvedUrl));

            const existentesHTML = existentesResueltas.map(f => {
              const src = typeof f.resolvedUrl === 'string' && !f.resolvedUrl.startsWith('r2://')
                ? f.resolvedUrl
                : null;
              if (!src) {
                return '<div class="foto-general-thumb"><div class="hint" style="padding:12px;text-align:center;">Foto temporalmente no disponible</div></div>';
              }
              return '<div class="foto-general-thumb"><img src="' + escAttr(src) + '" style="cursor:pointer;" onclick="ampliarImagen(\\'' + escAttr(src) + '\\',' + escAttr(allUrls) + ')"></div>';
            }).join('');

            const pendientesHTML = fotosGeneralesPendientes.map((f, i) =>
              '<div class="foto-general-thumb"><img src="' + escAttr(f.previewUrl) + '" style="cursor:pointer;" onclick="ampliarImagen(this.src)">' +
                '<button type="button" class="quitar-foto" title="Quitar" onclick="quitarFotoGeneralPendiente(' + i + ')">✕</button>' +
              '</div>'
            ).join('');
            cont.innerHTML = existentesHTML + pendientesHTML;
          }

          /** Agrega fotos a la cola pendiente (se suben al guardar la orden). */
          export async function agregarFotosGeneralesOrden(fileList) {
            Array.from(fileList || []).forEach(file => {
              if (!file.type || !file.type.startsWith('image/')) return;
              const objectUrl = URL.createObjectURL(file);
              fotosGeneralesPendientes.push({ file, previewUrl: objectUrl });
            });
            await renderFotosGeneralesPreview();
          }

          export async function quitarFotoGeneralPendiente(i) {
            const pendiente = fotosGeneralesPendientes[i];
            if (pendiente && typeof pendiente.previewUrl === 'string' && pendiente.previewUrl.startsWith('blob:')) {
              URL.revokeObjectURL(pendiente.previewUrl);
            }
            fotosGeneralesPendientes.splice(i, 1);
            await renderFotosGeneralesPreview();
          }'''
              s = regex_once(s, pattern, repl, f'{rel}: bloque preview fotos generales')

              s = replace_once(
                  s,
                  "      fotosGeneralesPendientes = [];\n    }\n    await persist();",
                  "      limpiarFotosGeneralesPendientes();\n    }\n    await persist();",
                  f'{rel}: revocar blob tras upload'
              )
              p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------
          # galeria.js — null explícito y nunca onclick con r2://.
          # ------------------------------------------------------------
          for rel in ['js/modules/galeria.js', 'www/js/modules/galeria.js']:
              p = Path(rel)
              s = p.read_text(encoding='utf-8')
              old = '''function fotoUrlNavegable(foto) {
            const url = foto && (foto.resolvedUrl || foto.url) ? (foto.resolvedUrl || foto.url) : '';
            return url && !url.startsWith('r2://') ? url : PIXEL_TRANSPARENTE;
          }'''
              new = '''function fotoUrlNavegable(foto) {
            if (!foto) return PIXEL_TRANSPARENTE;
            if (foto.url && foto.url.startsWith('r2://') && foto.resolvedUrl == null) {
              return PIXEL_TRANSPARENTE;
            }
            const url = foto.resolvedUrl || foto.url || '';
            return url && !url.startsWith('r2://') ? url : PIXEL_TRANSPARENTE;
          }'''
              s = replace_once(s, old, new, f'{rel}: fotoUrlNavegable')
              old_click = "onclick=\"ampliarImagen(\\'\" + String(foto.url || '').replace(/'/g, \"\\\\'\") + \"\\')\""
              new_click = "onclick=\"ampliarImagen(\\'\" + String(src || '').replace(/'/g, \"\\\\'\") + \"\\')\""
              count = s.count(old_click)
              if count != 2:
                  raise SystemExit(f'{rel}: onclick galería esperado 2, encontrados {count}')
              s = s.replace(old_click, new_click)
              p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------
          # hotfix — null de R2 => placeholder, jamás reinyectar r2://.
          # ------------------------------------------------------------
          for rel in ['js/hotfix-fotos-20260907.js', 'www/js/hotfix-fotos-20260907.js']:
              p = Path(rel)
              s = p.read_text(encoding='utf-8')
              old = '''      const signed = await storageManager.resolveImageUrl(original);
                if (signed && !signed.startsWith('r2://')) {
                  img.setAttribute('src', signed);
                  img.removeAttribute('data-sm-r2-src');
                }'''
              new = '''      const signed = await storageManager.resolveImageUrl(original);
                if (signed) {
                  img.setAttribute('src', signed);
                  img.removeAttribute('data-sm-r2-src');
                  img.removeAttribute('data-sm-r2-unavailable');
                } else {
                  img.setAttribute('src', PIXEL_TRANSPARENTE);
                  img.dataset.smR2Unavailable = 'true';
                }'''
              s = replace_once(s, old, new, f'{rel}: resolverImagenR2 null-safe')
              p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------
          # produccion.js — URLs firmadas + generation guard + async flow.
          # ------------------------------------------------------------
          for rel in ['js/modules/produccion.js', 'www/js/modules/produccion.js']:
              p = Path(rel)
              s = p.read_text(encoding='utf-8')

              s = replace_once(
                  s,
                  "const META_DIARIA = 50;\nconst MAX_FOTOS_POR_REGISTRO = 100;",
                  "const META_DIARIA = 50;\nconst MAX_FOTOS_POR_REGISTRO = 100;\nlet _produccionRenderGen = 0;",
                  f'{rel}: generation var'
              )

              pattern = r"export function renderProduccion\(\) \{.*?\n\}\n\n/\*\* Llena el selector"
              repl = '''export async function renderProduccion() {
            const miGen = ++_produccionRenderGen;
            const fechaEl = document.getElementById('prod-fecha');
            if (fechaEl && !fechaEl.value) fechaEl.value = todayISO(0);
            const histEl = document.getElementById('prod-historial-fecha');
            if (histEl && !histEl.value) histEl.value = todayISO(0);

            // La producción siempre queda a nombre del usuario que está registrando.
            const empEl = document.getElementById('prod-empleado');
            if (empEl) {
              empEl.value = (state.session && state.session.user) || '';
              empEl.readOnly = true;
            }

            const hoy = todayISO(0);
            let registrosHoy = (state.registroPares || []).filter(r => r.fecha === hoy);
            if (esEmpleado()) registrosHoy = registrosHoy.filter(esRegistroPropio);

            await renderResumenPares('prod-kpi-grid', 'prod-lista', registrosHoy, {
              permitirEliminar: true,
              tituloVacio: 'Todavía no hay artículos registrados hoy.',
              mostrarFotos: true,
              mostrarEmpleado: puedeVerEmpleadoProd(false)
            }, miGen);
            if (miGen !== _produccionRenderGen) return;

            const histPanel = document.getElementById('prod-historial-panel');
            if (histPanel) histPanel.style.display = esEmpleado() ? 'none' : '';
            if (!esEmpleado()) {
              poblarFiltroEmpleadoProduccion();
              await renderHistorialProduccion(miGen);
            }
          }

          /** Llena el selector'''
              s = regex_once(s, pattern, repl, f'{rel}: renderProduccion')

              pattern = r"function renderResumenPares\(kpiElId, listaElId, registros, opts\) \{.*?\n\}\n\n/\*\* Muestra cuántas fotos"
              repl = '''async function renderResumenPares(kpiElId, listaElId, registros, opts, miGen = null) {
            opts = opts || {};
            const mostrarFotos = opts.mostrarFotos !== false;
            const mostrarEmpleado = opts.mostrarEmpleado !== false;
            const total = registros.reduce((sum, r) => sum + Number(r.pares || 0), 0);
            const totalFotos = registros.reduce((sum, r) => sum + (Array.isArray(r.fotoUrls) ? r.fotoUrls.length : 0), 0);

            const porEmpleado = {};
            registros.forEach(r => { porEmpleado[r.empleado] = (porEmpleado[r.empleado] || 0) + Number(r.pares || 0); });
            const rankingHtml = !mostrarEmpleado
              ? '<div class="hint">Elige una fecha para ver el detalle por empleado.</div>'
              : (Object.keys(porEmpleado).length
                ? Object.entries(porEmpleado).sort((a, b) => b[1] - a[1]).map(([nombre, cant]) =>
                    '<div style="display:flex;justify-content:space-between;padding:4px 0;"><span>' + escHtml(nombre) + '</span><strong>' + cant + '</strong></div>'
                  ).join('')
                : '<div class="hint">Sin registros por empleado.</div>');

            // Resolver todas las referencias R2 antes de escribir los listados.
            const registrosRender = await Promise.all(registros.slice().reverse().map(async r => {
              const fotos = Array.isArray(r.fotoUrls) ? r.fotoUrls : (r.fotoUrl ? [r.fotoUrl] : []);
              const fotosResueltas = !mostrarFotos ? [] : await storageManager.resolveImageUrls(fotos.map(url => ({ url })));
              const urlsNavegables = fotosResueltas
                .map(f => f.resolvedUrl)
                .filter(url => typeof url === 'string' && !url.startsWith('r2://'));
              return { r, fotos, urlsNavegables };
            }));

            if (miGen !== null && miGen !== _produccionRenderGen) return false;

            const kpiGrid = kpiElId && document.getElementById(kpiElId);
            if (kpiGrid) {
              kpiGrid.innerHTML =
                '<div class="kpi-card"><div class="kpi-label">Artículos registrados</div><div class="kpi-value">' + total + (total >= META_DIARIA ? ' 🎉' : '') + '</div></div>' +
                '<div class="kpi-card"><div class="kpi-label">Fotos de respaldo</div><div class="kpi-value">' + totalFotos + '</div></div>' +
                '<div class="kpi-card"><div class="kpi-label">Por usuario</div><div style="padding-top:4px;">' + rankingHtml + '</div></div>';
            }

            const lista = listaElId && document.getElementById(listaElId);
            if (lista) {
              const tarjetas = registrosRender.map(({ r, fotos, urlsNavegables }) => {
                const primeraFoto = urlsNavegables[0] || null;
                const extra = urlsNavegables.length > 1 ? '<div class="hint" style="position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:1px 6px;">+' + (urlsNavegables.length - 1) + '</div>' : '';
                const bloqueFoto = !mostrarFotos
                  ? '<div class="empty-state" style="padding:20px;"><div class="big">📅</div><div class="hint">— (filtrá por fecha para ver fotos)</div></div>'
                  : (primeraFoto
                    ? '<div style="position:relative;"><img src="' + escAttr(primeraFoto) + '" loading="lazy" onclick="ampliarImagen(\\'' + escAttr(primeraFoto) + '\\', ' + escAttr(JSON.stringify(urlsNavegables)) + ')">' + extra + '</div>'
                    : (fotos.length
                      ? '<div class="empty-state" style="padding:20px;"><div class="big">👟</div>Foto temporalmente no disponible</div>'
                      : '<div class="empty-state" style="padding:20px;"><div class="big">👟</div>Sin foto</div>'));
                const empleadoHTML = mostrarEmpleado ? '<strong>' + escHtml(r.empleado) + '</strong>' : '<strong>Artículo registrado</strong>';
                return '<div class="prod-card">' +
                  bloqueFoto +
                  '<div style="padding:6px 4px;">' +
                    '<div>' + empleadoHTML + (r.codigo ? ' · <span class="mono">' + escHtml(r.codigo) + '</span>' : '') + (r.servicio ? ' · ' + escHtml(r.servicio) : '') + '</div>' +
                    '<div class="hint">' + r.pares + ' ' + (Number(r.pares) === 1 ? 'artículo' : 'artículos') + ' · ' + fmtDate(r.fecha) + (fotos.length ? ' · ' + fotos.length + ' foto(s)' : '') + '</div>' +
                    (r.hora ? '<div class="hint">Hora: ' + escHtml(r.hora) + '</div>' : '') +
                    (r.observacion ? '<div class="hint" style="white-space:pre-line;">📝 ' + escHtml(r.observacion) + '</div>' : '') +
                    (opts.permitirEliminar && state.session && state.session.role === 'Administrador' ? '<button class="btn btn-ghost btn-sm" style="color:var(--red);margin-top:4px;" onclick="eliminarRegistroPar(\\'' + r.id + '\\')">Eliminar</button>' : '') +
                  '</div>' +
                '</div>';
              }).join('');

              // Guard crítico: DESPUÉS de resolver URLs y justo ANTES del DOM.
              if (miGen !== null && miGen !== _produccionRenderGen) return false;
              lista.innerHTML = registros.length
                ? '<div class="prod-grid">' + tarjetas + '</div>'
                : '<div class="hint">' + (opts.tituloVacio || 'Sin registros.') + '</div>';
            }
            return true;
          }

          /** Muestra cuántas fotos'''
              s = regex_once(s, pattern, repl, f'{rel}: renderResumenPares')

              # Callers that already live inside async functions.
              replacements = [
                ("    renderProduccion();\n    showToast('Observación agregada ✓');", "    await renderProduccion();\n    showToast('Observación agregada ✓');", 'observación'),
                ("        renderProduccion();\n        if (window.renderOrdenes) window.renderOrdenes();\n        showToast('📷 Foto(s) agregada(s) al registro existente ✓');", "        await renderProduccion();\n        if (window.renderOrdenes) window.renderOrdenes();\n        showToast('📷 Foto(s) agregada(s) al registro existente ✓');", 'fotos registro existente'),
                ("      renderProduccion();\n      return;", "      await renderProduccion();\n      return;", 'conflicto duplicado'),
                ("    renderProduccion();\n    showToast('Artículos registrados ✓');", "    await renderProduccion();\n    showToast('Artículos registrados ✓');", 'registro exitoso'),
                ("  state.registroPares = state.registroPares.filter(r => r.id !== id);\n  renderProduccion();\n  const res = await db.deleteRegistroPar(id);", "  state.registroPares = state.registroPares.filter(r => r.id !== id);\n  void renderProduccion();\n  const res = await db.deleteRegistroPar(id);", 'delete optimista'),
                ("    state.registroPares = backup;\n    renderProduccion();\n    showToast('No se pudo eliminar:", "    state.registroPares = backup;\n    await renderProduccion();\n    showToast('No se pudo eliminar:", 'delete rollback'),
              ]
              for old, new, label in replacements:
                  s = replace_once(s, old, new, f'{rel}: {label}')

              s = replace_once(s, "export function renderHistorialProduccion() {", "export async function renderHistorialProduccion(miGen = null) {\n  const gen = miGen === null ? ++_produccionRenderGen : miGen;", f'{rel}: async historial')
              s = replace_once(s, "  renderResumenPares('prod-historial-kpi', 'prod-historial-lista', registros, { permitirEliminar: false, tituloVacio: 'No hay artículos registrados en esta fecha' + (empleado ? ' para ' + empleado : '') + '.', mostrarFotos: hayFechaActiva, mostrarEmpleado: puedeVerEmpleadoProd(true) });", "  await renderResumenPares('prod-historial-kpi', 'prod-historial-lista', registros, { permitirEliminar: false, tituloVacio: 'No hay artículos registrados en esta fecha' + (empleado ? ' para ' + empleado : '') + '.', mostrarFotos: hayFechaActiva, mostrarEmpleado: puedeVerEmpleadoProd(true) }, gen);", f'{rel}: await historial resumen')

              s = replace_once(s, "export function verSemanaProduccion() {", "export async function verSemanaProduccion() {\n  const miGen = ++_produccionRenderGen;", f'{rel}: async semana')
              s = replace_once(s, "  renderResumenPares('prod-historial-kpi', 'prod-historial-lista', registros, { permitirEliminar: false, tituloVacio: 'No hay artículos registrados en los últimos 7 días' + (empleado ? ' para ' + empleado : '') + '.', mostrarFotos: false, mostrarEmpleado: puedeVerEmpleadoProd(false) });", "  await renderResumenPares('prod-historial-kpi', 'prod-historial-lista', registros, { permitirEliminar: false, tituloVacio: 'No hay artículos registrados en los últimos 7 días' + (empleado ? ' para ' + empleado : '') + '.', mostrarFotos: false, mostrarEmpleado: puedeVerEmpleadoProd(false) }, miGen);", f'{rel}: await semana resumen')

              s = replace_once(s, "export function verMesProduccion() {", "export async function verMesProduccion() {\n  const miGen = ++_produccionRenderGen;", f'{rel}: async mes')
              s = replace_once(s, "  renderResumenPares('prod-historial-kpi', 'prod-historial-lista', registros, { permitirEliminar: false, tituloVacio: 'No hay artículos registrados en los últimos 31 días' + (empleado ? ' para ' + empleado : '') + '.', mostrarFotos: false, mostrarEmpleado: puedeVerEmpleadoProd(false) });", "  await renderResumenPares('prod-historial-kpi', 'prod-historial-lista', registros, { permitirEliminar: false, tituloVacio: 'No hay artículos registrados en los últimos 31 días' + (empleado ? ' para ' + empleado : '') + '.', mostrarFotos: false, mostrarEmpleado: puedeVerEmpleadoProd(false) }, miGen);", f'{rel}: await mes resumen')

              p.write_text(s, encoding='utf-8')

          # app.js — no volver switchTab async; render de Producción es fire-and-forget.
          for rel in ['js/app.js', 'www/js/app.js']:
              p = Path(rel)
              s = p.read_text(encoding='utf-8')
              s = replace_once(s, "  if (tab === 'produccion') renderProduccion();", "  if (tab === 'produccion') void renderProduccion();", f'{rel}: switchTab producción')
              p.write_text(s, encoding='utf-8')

          # Los espejos deben quedar byte-a-byte iguales.
          pairs = [
              ('js/storage-manager.js', 'www/js/storage-manager.js'),
              ('js/modules/ordenes.js', 'www/js/modules/ordenes.js'),
              ('js/modules/produccion.js', 'www/js/modules/produccion.js'),
              ('js/modules/galeria.js', 'www/js/modules/galeria.js'),
              ('js/hotfix-fotos-20260907.js', 'www/js/hotfix-fotos-20260907.js'),
              ('js/app.js', 'www/js/app.js'),
          ]
          for a, b in pairs:
              if Path(a).read_bytes() != Path(b).read_bytes():
                  raise SystemExit(f'Espejos distintos después del parche: {a} != {b}')

          # Invariantes del fix.
          for rel in ['js/storage-manager.js', 'www/js/storage-manager.js']:
              s = Path(rel).read_text(encoding='utf-8')
              assert "return esReferenciaR2 ? null : url;" in s
              assert "console.warn('No se pudo resolver referencia R2:'" in s
          for rel in ['js/modules/ordenes.js', 'www/js/modules/ordenes.js']:
              s = Path(rel).read_text(encoding='utf-8')
              assert 'async function renderFotosGeneralesPreview()' in s
              assert 'await storageManager.resolveImageUrls(fotosGeneralesExistentes)' in s
              assert 'URL.revokeObjectURL' in s
          for rel in ['js/modules/produccion.js', 'www/js/modules/produccion.js']:
              s = Path(rel).read_text(encoding='utf-8')
              assert 'let _produccionRenderGen = 0;' in s
              assert 'const miGen = ++_produccionRenderGen;' in s
              assert 'if (miGen !== null && miGen !== _produccionRenderGen) return false;\n              lista.innerHTML' in s
              assert 'void renderProduccion();' in s

          PY

          for f in \
            js/storage-manager.js www/js/storage-manager.js \
            js/modules/ordenes.js www/js/modules/ordenes.js \
            js/modules/produccion.js www/js/modules/produccion.js \
            js/modules/galeria.js www/js/modules/galeria.js \
            js/hotfix-fotos-20260907.js www/js/hotfix-fotos-20260907.js \
            js/app.js www/js/app.js; do
            node --check "$f"
          done

          git diff --check

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "SneakerMania Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-r2-render-fix.yml
          git add \
            js/storage-manager.js www/js/storage-manager.js \
            js/modules/ordenes.js www/js/modules/ordenes.js \
            js/modules/produccion.js www/js/modules/produccion.js \
            js/modules/galeria.js www/js/modules/galeria.js \
            js/hotfix-fotos-20260907.js www/js/hotfix-fotos-20260907.js \
            js/app.js www/js/app.js
          git commit -m "fix: blindar render R2 y carreras de Producción"
          git push origin HEAD:release/sneakermania-final-20260907
