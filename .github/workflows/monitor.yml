name: SneakerMania Monitor — Manual Diagnostic

# El monitoreo productivo ya corre internamente en Supabase pg_cron y mide
# la BD + R2 con credenciales que nunca salen del servidor. Este workflow
# queda únicamente como diagnóstico manual para evitar secretos duplicados.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  info:
    name: Estado del monitor
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "El monitor productivo de SneakerMania se ejecuta desde Supabase pg_cron."
          echo "No se almacenan secretos de producción en GitHub Actions."
